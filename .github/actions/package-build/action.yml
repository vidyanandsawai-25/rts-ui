name: NTIS UI Package Build
description: Build, package, and upload the NTIS UI artifact.

inputs:
  version:
    description: Release version in x.y.z.w format.
    required: true

  branch:
    description: Branch being built.
    required: false
    default: main

  path-mode:
    description: Upload path mode. Use standalone for repo-local runs and orchestrated for ntis-devops runs.
    required: false
    default: standalone

  branch-env-map:
    description: JSON mapping of branch names to environment names.
    required: true

  package-container-name:
    description: Azure Blob container name for package uploads.
    required: true

  package-connection-string:
    description: Azure Storage connection string.
    required: true

  node-version:
    description: Node.js version to use.
    required: false
    default: 20.x


outputs:
  version:
    description: Validated version.
    value: ${{ steps.version_setup.outputs.version }}

  artifact-name:
    description: Generated artifact name.
    value: ${{ steps.version_setup.outputs.artifact-name }}

  environment:
    description: Target environment derived from branch.
    value: ${{ steps.version_setup.outputs.environment }}

  branch:
    description: Branch used for the build.
    value: ${{ steps.version_setup.outputs.branch }}


runs:
  using: composite

  steps:

    # ============================================================
    # 1. VALIDATE VERSION / BRANCH / ENVIRONMENT
    # ============================================================

    - name: Setup version and validation
      id: version_setup
      shell: pwsh
      env:
        RELEASE_VERSION_INPUT: ${{ inputs.version }}
        BUILD_BRANCH_INPUT: ${{ inputs.branch }}
        PATH_MODE_INPUT: ${{ inputs.path-mode }}
        BRANCH_ENV_MAP_JSON: ${{ inputs.branch-env-map }}

      run: |
        $version = $env:RELEASE_VERSION_INPUT
        $branch = $env:BUILD_BRANCH_INPUT
        $pathMode = $env:PATH_MODE_INPUT

        Write-Output ""
        Write-Output "============================================"
        Write-Output "NTIS UI PACKAGE BUILD"
        Write-Output "============================================"
        Write-Output "Version   : $version"
        Write-Output "Branch    : $branch"
        Write-Output "Path Mode : $pathMode"
        Write-Output ""

        # --------------------------------------------------------
        # Validate release version
        # --------------------------------------------------------

        if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
          Write-Error "Invalid version format: $version"
          Write-Error "Expected format: x.y.z.w (example: 2.0.0.0)"
          exit 1
        }

        # --------------------------------------------------------
        # Validate path mode
        # --------------------------------------------------------

        if ($pathMode -notin @('standalone', 'orchestrated')) {
          Write-Error "Invalid path-mode: $pathMode"
          Write-Error "Allowed values: standalone, orchestrated"
          exit 1
        }

        # --------------------------------------------------------
        # Parse branch environment map
        # --------------------------------------------------------

        try {
          $branchEnvMap = $env:BRANCH_ENV_MAP_JSON | ConvertFrom-Json
        }
        catch {
          Write-Error "Invalid BRANCH_ENV_MAP JSON."
          exit 1
        }

        $environmentProperty =
          $branchEnvMap.PSObject.Properties[$branch]

        # IMPORTANT:
        # Never silently map an unknown branch to production.
        if (-not $environmentProperty) {
          Write-Error "No environment mapping exists for branch: $branch"
          exit 1
        }

        $environment = $environmentProperty.Value

        if ([string]::IsNullOrWhiteSpace($environment)) {
          Write-Error "Environment mapping for branch '$branch' is empty."
          exit 1
        }

        # --------------------------------------------------------
        # Determine actual checked-out NTIS UI commit
        # --------------------------------------------------------

        try {
          $sourceSha = (git rev-parse HEAD).Trim()
        }
        catch {
          Write-Error "Unable to determine source Git commit."
          exit 1
        }

        $artifactName = "ntis-ui-$environment-v$version"

        # --------------------------------------------------------
        # Set outputs
        # --------------------------------------------------------

        "version=$version" >> $env:GITHUB_OUTPUT
        "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT
        "environment=$environment" >> $env:GITHUB_OUTPUT
        "branch=$branch" >> $env:GITHUB_OUTPUT
        "source-sha=$sourceSha" >> $env:GITHUB_OUTPUT

        Write-Output "Environment : $environment"
        Write-Output "Commit      : $sourceSha"
        Write-Output "Artifact    : $artifactName"
        Write-Output ""
        Write-Output "Validation completed successfully."


    # ============================================================
    # 2. VERIFY PACKAGE LOCK
    # ============================================================

    - name: Verify package lock
      shell: pwsh
      run: |
        if (-not (Test-Path 'package-lock.json')) {
          Write-Error "package-lock.json not found."
          Write-Error "npm ci requires package-lock.json."
          exit 1
        }

        Write-Output "package-lock.json verified."


    # ============================================================
    # 3. SETUP NODE + NPM CACHE
    # ============================================================

    - name: Setup Node.js with npm cache
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json


    # ============================================================
    # 4. INSTALL DEPENDENCIES
    # ============================================================

    - name: Install dependencies
      shell: pwsh
      run: |
        $start = Get-Date

        Write-Output ""
        Write-Output "Installing dependencies using npm ci..."

        npm ci --prefer-offline --no-audit --no-fund

        if ($LASTEXITCODE -ne 0) {
          Write-Error "npm ci failed."
          exit $LASTEXITCODE
        }

        $elapsed = (Get-Date) - $start

        Write-Output ""
        Write-Output "Dependencies installed successfully."
        Write-Output "Install time: $([math]::Round($elapsed.TotalSeconds, 2)) seconds"


    # ============================================================
    # 5. RESTORE NEXT.JS BUILD CACHE
    # ============================================================

    - name: Restore Next.js build cache
      uses: actions/cache@v4
      with:
        path: .next/cache

        key: >-
          ${{ runner.os }}-ntis-ui-next-${{
          inputs.branch }}-${{
          hashFiles('package-lock.json') }}-${{
          steps.version_setup.outputs.source-sha }}

        restore-keys: |
          ${{ runner.os }}-ntis-ui-next-${{ inputs.branch }}-${{ hashFiles('package-lock.json') }}-
          ${{ runner.os }}-ntis-ui-next-${{ inputs.branch }}-
          ${{ runner.os }}-ntis-ui-next-


    # ============================================================
    # 6. BUILD NEXT.JS / TURBOPACK
    # ============================================================

    - name: Build with Turbopack
      shell: pwsh
      env:
        NEXT_PUBLIC_APP_VERSION: ${{ steps.version_setup.outputs.version }}

      run: |
        $version = $env:NEXT_PUBLIC_APP_VERSION
        $start = Get-Date

        Write-Output ""
        Write-Output "============================================"
        Write-Output "BUILDING NTIS UI"
        Write-Output "============================================"
        Write-Output "Version : $version"
        Write-Output ""

        npm run build:production

        if ($LASTEXITCODE -ne 0) {
          Write-Error "NTIS UI build failed."
          exit $LASTEXITCODE
        }

        $elapsed = (Get-Date) - $start

        Write-Output ""
        Write-Output "Turbopack build completed successfully."
        Write-Output "Build time: $([math]::Round($elapsed.TotalSeconds, 2)) seconds"


    # ============================================================
    # 7. VERIFY BUILD OUTPUT
    # ============================================================

    - name: Verify build output
      shell: pwsh
      run: |
        Write-Output ""
        Write-Output "Verifying Next.js standalone build..."

        $requiredPaths = @(
          '.next',
          '.next\standalone',
          '.next\static',
          '.next\standalone\server.js'
        )

        foreach ($path in $requiredPaths) {

          if (-not (Test-Path $path)) {
            Write-Error "Required build output missing: $path"
            exit 1
          }

        }

        Write-Output "Next.js standalone build verified successfully."


    # ============================================================
    # 8. CREATE DEPLOYMENT PACKAGE
    #
    # IMPORTANT:
    # We MOVE .next\standalone instead of copying it.
    #
    # This avoids copying thousands of small node_modules files
    # and significantly reduces package preparation time.
    # ============================================================

    - name: Create deployment package
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{ steps.version_setup.outputs.version }}

      run: |
        $version = $env:PACKAGE_VERSION
        $deploymentDir = "ntis-ui-v$version"

        $start = Get-Date

        Write-Output ""
        Write-Output "============================================"
        Write-Output "CREATING DEPLOYMENT PACKAGE"
        Write-Output "============================================"
        Write-Output "Directory: $deploymentDir"
        Write-Output ""

        # --------------------------------------------------------
        # Remove previous deployment directory if present
        # --------------------------------------------------------

        if (Test-Path $deploymentDir) {

          Write-Output "Removing previous deployment directory..."

          Remove-Item `
            -Path $deploymentDir `
            -Recurse `
            -Force
        }


        # --------------------------------------------------------
        # Move standalone application
        #
        # Faster than Copy-Item / Robocopy on the same disk.
        # --------------------------------------------------------

        if (-not (Test-Path '.next\standalone')) {

          Write-Error ".next\standalone not found."
          exit 1
        }

        Write-Output "Moving standalone application..."

        Move-Item `
          -Path '.next\standalone' `
          -Destination $deploymentDir


        # --------------------------------------------------------
        # Prepare deployment .next directory
        # --------------------------------------------------------

        $deploymentNextDir =
          "$deploymentDir\.next"

        if (-not (Test-Path $deploymentNextDir)) {

          New-Item `
            -ItemType Directory `
            -Path $deploymentNextDir `
            -Force | Out-Null
        }


        # --------------------------------------------------------
        # Move Next.js static files
        # --------------------------------------------------------

        if (-not (Test-Path '.next\static')) {

          Write-Error ".next\static not found."
          exit 1
        }

        $staticDestination =
          "$deploymentDir\.next\static"

        if (Test-Path $staticDestination) {

          Remove-Item `
            -Path $staticDestination `
            -Recurse `
            -Force
        }

        Write-Output "Moving Next.js static files..."

        Move-Item `
          -Path '.next\static' `
          -Destination $staticDestination


        # --------------------------------------------------------
        # Move public assets
        # --------------------------------------------------------

        if (Test-Path 'public') {

          $publicDestination =
            "$deploymentDir\public"

          if (Test-Path $publicDestination) {

            Remove-Item `
              -Path $publicDestination `
              -Recurse `
              -Force
          }

          Write-Output "Moving public assets..."

          Move-Item `
            -Path 'public' `
            -Destination $publicDestination

        }
        else {

          Write-Output "Public directory not present. Skipping."

        }


        # --------------------------------------------------------
        # Verify locale files
        # --------------------------------------------------------

        $localeDestination =
          "$deploymentDir\src\i18n\locales"

        if (Test-Path $localeDestination) {

          Write-Output "Locale files already present."

        }
        elseif (Test-Path 'src\i18n\locales') {

          Write-Output "Locale files not included in standalone output."
          Write-Output "Copying locale files..."

          New-Item `
            -ItemType Directory `
            -Path "$deploymentDir\src\i18n" `
            -Force | Out-Null

          Copy-Item `
            -Path 'src\i18n\locales' `
            -Destination $localeDestination `
            -Recurse `
            -Force

        }
        else {

          Write-Warning "Locale directory not found."

        }


        # --------------------------------------------------------
        # Preserve existing .env behavior
        #
        # IMPORTANT:
        # After you remove .env from Git, replace this with
        # GitHub Variables / GitHub Secrets based configuration.
        # --------------------------------------------------------

        if (Test-Path '.env') {

          Write-Output "Copying runtime .env..."

          Copy-Item `
            -Path '.env' `
            -Destination "$deploymentDir\.env" `
            -Force

        }


        # --------------------------------------------------------
        # Create runtime package.json
        # --------------------------------------------------------

        @{
          name = "ntis-ui"

          version = $version

          scripts = @{
            start = "node server.js"
          }

        } |
        ConvertTo-Json -Depth 5 |
        Set-Content `
          -Path "$deploymentDir\package.json" `
          -Encoding UTF8


        # --------------------------------------------------------
        # Verify deployment package
        # --------------------------------------------------------

        if (-not (Test-Path "$deploymentDir\server.js")) {

          Write-Error "Deployment package invalid: server.js missing."
          exit 1

        }

        if (-not (Test-Path "$deploymentDir\.next\static")) {

          Write-Error "Deployment package invalid: .next/static missing."
          exit 1

        }


        $elapsed = (Get-Date) - $start

        Write-Output ""
        Write-Output "============================================"
        Write-Output "DEPLOYMENT PACKAGE READY"
        Write-Output "============================================"
        Write-Output "Version      : $version"
        Write-Output "Directory    : $deploymentDir"
        Write-Output "Package time : $([math]::Round($elapsed.TotalSeconds, 2)) seconds"


    # ============================================================
    # 9. CREATE ZIP ARCHIVE
    #
    # Uses tar.exe first because it is generally faster on Windows
    # for packages containing many small files.
    #
    # Compress-Archive is retained as a fallback.
    # ============================================================

    - name: Create zip archive
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{ steps.version_setup.outputs.version }}
        TARGET_ENVIRONMENT: ${{ steps.version_setup.outputs.environment }}

      run: |
        $version = $env:PACKAGE_VERSION
        $environment = $env:TARGET_ENVIRONMENT

        $deploymentDir =
          "ntis-ui-v$version"

        $zipFile =
          "ntis-ui-$environment-v$version.zip"

        $start = Get-Date

        Write-Output ""
        Write-Output "============================================"
        Write-Output "CREATING ZIP ARCHIVE"
        Write-Output "============================================"
        Write-Output "Archive: $zipFile"
        Write-Output ""

        # --------------------------------------------------------
        # Remove existing archive
        # --------------------------------------------------------

        if (Test-Path $zipFile) {

          Remove-Item `
            -Path $zipFile `
            -Force
        }


        # --------------------------------------------------------
        # Prefer tar.exe
        # --------------------------------------------------------

        if (Get-Command tar.exe -ErrorAction SilentlyContinue) {

          Write-Output "Using tar.exe for compression..."

          tar.exe `
            -a `
            -c `
            -f $zipFile `
            -C $deploymentDir `
            .

          if ($LASTEXITCODE -ne 0) {

            Write-Error "tar.exe archive creation failed."
            exit $LASTEXITCODE

          }

        }
        else {

          Write-Warning "tar.exe not found."
          Write-Warning "Using Compress-Archive fallback."

          Compress-Archive `
            -Path "$deploymentDir\*" `
            -DestinationPath $zipFile `
            -Force

        }


        # --------------------------------------------------------
        # Verify archive
        # --------------------------------------------------------

        if (-not (Test-Path $zipFile)) {

          Write-Error "ZIP archive was not created."
          exit 1

        }


        $zipSize =
          [math]::Round(
            (Get-Item $zipFile).Length / 1MB,
            2
          )

        $elapsed =
          (Get-Date) - $start


        Write-Output ""
        Write-Output "Archive created successfully."
        Write-Output "Archive size : $zipSize MB"
        Write-Output "Archive time : $([math]::Round($elapsed.TotalSeconds, 2)) seconds"


    # ============================================================
    # 10. UPLOAD PACKAGE TO AZURE BLOB STORAGE
    #
    # Existing Azure path structure is preserved.
    #
    # ORCHESTRATED:
    #   qa/2.0.0.0/ui/package.zip
    #
    # STANDALONE:
    #   ui/2.0.0.0/package.zip
    # ============================================================

    - name: Upload to Azure Blob Storage
      shell: pwsh

      env:
        PACKAGE_VERSION: ${{ steps.version_setup.outputs.version }}

        TARGET_ENVIRONMENT:
          ${{ steps.version_setup.outputs.environment }}

        PATH_MODE:
          ${{ inputs.path-mode }}

        PACKAGE_CONTAINER:
          ${{ inputs.package-container-name }}

        PACKAGE_CONNECTION_STRING:
          ${{ inputs.package-connection-string }}

      run: |
        $version = $env:PACKAGE_VERSION
        $environment = $env:TARGET_ENVIRONMENT
        $pathMode = $env:PATH_MODE

        $containerName =
          $env:PACKAGE_CONTAINER

        $connectionString =
          $env:PACKAGE_CONNECTION_STRING

        # --------------------------------------------------------
        # Determine Azure destination
        # --------------------------------------------------------

        if ($pathMode -eq 'orchestrated') {

          $basePath =
            "$environment/$version/ui"

        }
        else {

          $basePath =
            "ui/$version"

        }


        $zipFile =
          "ntis-ui-$environment-v$version.zip"


        $zipBlob =
          "$basePath/$zipFile".Replace('\', '/')


        Write-Output ""
        Write-Output "============================================"
        Write-Output "AZURE PACKAGE UPLOAD"
        Write-Output "============================================"
        Write-Output "Container : $containerName"
        Write-Output "Path      : $basePath"
        Write-Output "Package   : $zipFile"
        Write-Output "Blob      : $zipBlob"
        Write-Output ""


        # --------------------------------------------------------
        # Verify ZIP exists
        # --------------------------------------------------------

        if (-not (Test-Path $zipFile)) {

          Write-Error "Package file missing: $zipFile"
          exit 1

        }


        # --------------------------------------------------------
        # Verify Azure CLI
        # --------------------------------------------------------

        if (-not (Get-Command az -ErrorAction SilentlyContinue)) {

          Write-Error "Azure CLI is not installed or unavailable in PATH."
          exit 1

        }


        # --------------------------------------------------------
        # Upload
        # --------------------------------------------------------

        $start = Get-Date


        az storage blob upload `
          --connection-string "$connectionString" `
          --container-name "$containerName" `
          --file "$zipFile" `
          --name "$zipBlob" `
          --overwrite true `
          --only-show-errors


        if ($LASTEXITCODE -ne 0) {

          Write-Error "Azure Blob upload failed."
          exit $LASTEXITCODE

        }


        $elapsed =
          (Get-Date) - $start


        Write-Output ""
        Write-Output "============================================"
        Write-Output "PACKAGE UPLOADED SUCCESSFULLY"
        Write-Output "============================================"
        Write-Output "Version     : $version"
        Write-Output "Environment : $environment"
        Write-Output "Blob        : $zipBlob"
        Write-Output "Upload time : $([math]::Round($elapsed.TotalSeconds, 2)) seconds"
